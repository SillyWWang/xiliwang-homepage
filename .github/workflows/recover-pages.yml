name: Recover stuck Pages deployment

on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-pages.yml]
  workflow_dispatch:

permissions:
  pages: write
  actions: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel the stale Pages deployment and queued retry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = 'https://api.github.com/repos/' + os.environ['GH_REPO']
          stale_sha = 'cfbfb0dedca83e6590e7010ccb8010f987026490'
          retry_run = '41291621353'

          def request(path, method='GET', allowed_errors=()):
              headers = {
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'X-GitHub-Api-Version': '2026-03-10',
              }
              req = urllib.request.Request(base + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      print(method, path, 'HTTP', response.status, flush=True)
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  print(method, path, 'HTTP', error.code, flush=True)
                  if error.code not in allowed_errors:
                      raise
                  return None

          # Only the specific deployment named in the four failed runs is targeted.
          request('/pages/deployments/' + stale_sha + '/cancel', 'POST', (404,))
          run = request('/actions/runs/' + retry_run)
          print('Previous retry status:', run['status'], flush=True)
          if run['status'] in ('queued', 'waiting', 'requested', 'pending'):
              request('/actions/runs/' + retry_run + '/force-cancel', 'POST', (409,))
          PY
